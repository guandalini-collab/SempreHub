<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
  <title id="t">Modos e cenários do SempreHub</title>
  <desc id="d">A turma escolhe entre empresa tradicional e startup, combinadas com os cenários começar do zero ou recuperar uma empresa em crise.</desc>
  <defs><style>.box{rx:18;stroke-width:3}.h{font-weight:700;font-size:23px;font-family:Arial,sans-serif;fill:#0b2545}.p{font-size:16px;font-family:Arial,sans-serif;fill:#334155}.tag{font-weight:700;font-size:17px;font-family:Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1000" height="430" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" style="font-weight:700;font-size:28px;font-family:Arial,sans-serif;fill:#0b2545">Escolha pedagógica da turma</text>
  <rect class="box" x="38" y="85" width="430" height="145" fill="#e8f1fb" stroke="#0b2545"/><rect x="38" y="85" width="430" height="38" rx="18" fill="#0b2545"/><text class="tag" x="253" y="111" text-anchor="middle">EMPRESA TRADICIONAL</text><text class="p" x="60" y="155">Produção, matéria-prima, máquinas, estoque,</text><text class="p" x="60" y="181">logística, margem, ponto de equilíbrio e depreciação.</text><text class="p" x="60" y="207">Decisão: produzir, comprar, manter e entregar.</text>
  <rect class="box" x="532" y="85" width="430" height="145" fill="#eaf7ef" stroke="#24704f"/><rect x="532" y="85" width="430" height="38" rx="18" fill="#24704f"/><text class="tag" x="747" y="111" text-anchor="middle">STARTUP DE TECNOLOGIA</text><text class="p" x="554" y="155">Clientes, nuvem, aquisição, retenção, CAC,</text><text class="p" x="554" y="181">LTV, churn, runway e captação com diluição.</text><text class="p" x="554" y="207">Decisão: capacidade, atendimento e capital.</text>
  <rect class="box" x="38" y="260" width="430" height="125" fill="#fff7e6" stroke="#c5a059"/><text class="h" x="60" y="301">COMEÇAR DO ZERO</text><text class="p" x="60" y="331">Ideação, equipe, ativos e clientes começam</text><text class="p" x="60" y="356">a ser construídos na primeira rodada.</text>
  <rect class="box" x="532" y="260" width="430" height="125" fill="#f3edf9" stroke="#6b46a1"/><text class="h" x="554" y="301">RECUPERAÇÃO / CRISE</text><text class="p" x="554" y="331">A empresa começa com pressão de caixa,</text><text class="p" x="554" y="356">estoque, ativos, dívida e moral já configurados.</text>
</svg>
